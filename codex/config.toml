model = "gpt-5.6-sol"
model_reasoning_effort = "high"

# Claude-inspired, compact one-line footer:
# model + effort | project | git branch | context left | rate limits
[tui]
animations = false
status_line = [
  "model-with-reasoning",
  "project-name",
  "git-branch",
  "context-remaining",
  "five-hour-limit",
  "weekly-limit",
]
status_line_use_colors = true
