<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
    <!-- Not in the repo — install.linux.sh generates it in the Windows mirror.
         A 404 is expected there and in dev; the code falls back to WARP
         auto-detection when window.DOTFILES_PROFILE is undefined. -->
    <script src="./profile.js"></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"
      integrity="sha256-aS0B0wnsaDByLfE16h4MDCP1fQFccysd1YWOcV+gbBo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, { useState, useEffect, useRef, useCallback, useMemo } from 'https://esm.sh/react@18.3.1?dev';
      import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client?dev';
      import { invoke } from 'https://esm.sh/@tauri-apps/api@2.0.2/core';
      import * as zebar from 'https://esm.sh/zebar@3.0.3';

      // No hardware GPU (e.g. RDP/Citrix VM) → WebView2 rasterizes on CPU via
      // WARP ("Basic Render Driver") or SwiftShader; per-frame animation then
      // burns a core. gl.RENDERER is masked ("WebKit WebGL") — the real string
      // is only exposed through WEBGL_debug_renderer_info.
      const SOFT_RENDER = (() => {
        if (window.DOTFILES_PROFILE === 'light') return true;
        try {
          const gl = document.createElement('canvas').getContext('webgl');
          if (!gl) return true;
          const ext = gl.getExtension('WEBGL_debug_renderer_info');
          const renderer = ext && gl.getParameter(ext.UNMASKED_RENDERER_WEBGL);
          gl.getExtension('WEBGL_lose_context')?.loseContext();
          return !renderer || /swiftshader|software|llvmpipe|basic render driver|warp/i.test(renderer);
        } catch { return true; }
      })();
      if (SOFT_RENDER) document.documentElement.classList.add('soft-render');

      const statsInterval = SOFT_RENDER ? 2000 : 1000;
      const PINNED = zebar.currentWidget().name === 'market';
      const providers = PINNED ? null : zebar.createProviderGroup({
        glazewm: { type: 'glazewm' },
        network: { type: 'network', refreshInterval: statsInterval },
        cpu: { type: 'cpu', refreshInterval: statsInterval },
        memory: { type: 'memory', refreshInterval: statsInterval },
        battery: { type: 'battery' },
        media: { type: 'media' },
        audio: { type: 'audio' },
        systray: { type: 'systray' },
        date: { type: 'date', formatting: 'yyyy년 M월 d일 (EEE) HH:mm', locale: 'ko' },
      });

      createRoot(document.getElementById('root')).render(PINNED ? <PinnedMarket /> : <App />);

      function networkIcon(n) {
        const t = n.defaultInterface?.type;
        if (t === 'ethernet') return 'nf nf-md-ethernet_cable';
        if (t === 'wifi') {
          const s = n.defaultGateway?.signalStrength ?? 0;
          if (s >= 80) return 'nf nf-md-wifi_strength_4';
          if (s >= 65) return 'nf nf-md-wifi_strength_3';
          if (s >= 40) return 'nf nf-md-wifi_strength_2';
          if (s >= 25) return 'nf nf-md-wifi_strength_1';
          return 'nf nf-md-wifi_strength_outline';
        }
        return 'nf nf-md-wifi_strength_off_outline';
      }

      const BATTERY_BOLT = 'M12.4 1 7.4 6.9h3.2L9.6 11l5-5.9h-3.2Z';
      function BatteryIcon({ percent, charging }) {
        const level = Math.max(0, Math.min(100, percent)) / 100;
        return (
          <svg className="battery-icon" width="21" height="10" viewBox="0 0 25 12" aria-hidden="true">
            {charging && (
              <mask id="battery-bolt-cut">
                <rect width="25" height="12" fill="#fff" />
                <path d={BATTERY_BOLT} stroke="#000" strokeWidth="2.4" strokeLinejoin="round" />
              </mask>
            )}
            <g mask={charging ? 'url(#battery-bolt-cut)' : undefined}>
              <rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="currentColor" strokeOpacity="0.55" />
              <rect x="23" y="4" width="1.5" height="4" rx="0.75" fill="currentColor" fillOpacity="0.55" />
              <rect x="2" y="2" width={18 * level} height="8" rx="1.5" fill="currentColor" />
            </g>
            {charging && <path className="bolt" d={BATTERY_BOLT} />}
          </svg>
        );
      }

      function weatherIcon(w) {
        switch (w.status) {
          case 'clear_day':       return 'nf nf-weather-day_sunny';
          case 'clear_night':     return 'nf nf-weather-night_clear';
          case 'cloudy_day':      return 'nf nf-weather-day_cloudy';
          case 'cloudy_night':    return 'nf nf-weather-night_alt_cloudy';
          case 'light_rain_day':  return 'nf nf-weather-day_sprinkle';
          case 'light_rain_night':return 'nf nf-weather-night_alt_sprinkle';
          case 'heavy_rain_day':  return 'nf nf-weather-day_rain';
          case 'heavy_rain_night':return 'nf nf-weather-night_alt_rain';
          case 'snow_day':        return 'nf nf-weather-day_snow';
          case 'snow_night':      return 'nf nf-weather-night_alt_snow';
          case 'thunder_day':     return 'nf nf-weather-day_lightning';
          case 'thunder_night':   return 'nf nf-weather-night_alt_lightning';
          default:                return 'nf nf-weather-na';
        }
      }

      function weatherTint(status) {
        if (!status) return '';
        if (status.startsWith('thunder'))    return 'thunder';
        if (status.startsWith('snow'))       return 'snow';
        if (status.includes('rain'))         return 'rain';
        if (status.startsWith('clear_day'))  return 'sun';
        if (status.endsWith('_night'))       return 'moon';
        return '';
      }

      function formatRate(m) {
        if (!m) return '0 B';
        const v = m.siValue;
        const u = m.siUnit;
        return `${v < 10 ? v.toFixed(1) : Math.round(v)} ${u}`;
      }

      function volumeIcon(d) {
        if (d.isMuted || d.volume === 0) return 'nf nf-md-volume_off';
        if (d.volume < 34) return 'nf nf-md-volume_low';
        if (d.volume < 67) return 'nf nf-md-volume_medium';
        return 'nf nf-md-volume_high';
      }

      // Must match the ~F13 & <letter> jump combos in winget/winkey.ahk.
      // When a letter gets taken by a new f13 binding, remove it from BOTH
      // places. The map file below feeds AHK the hwnds in this same order.
      const JUMP_HINTS = 'asxcvqweg';
      let lastJumpMap = null;

      function writeJumpMap(glazewm) {
        if (!glazewm?.displayedWorkspace?.hasFocus) {
          lastJumpMap = null;
          return;
        }
        const handles = workspaceWindows(glazewm.displayedWorkspace)
          .slice(0, JUMP_HINTS.length)
          .map(w => w.handle);
        const map = handles.join(' ') || '0';
        if (map === lastJumpMap) return;
        lastJumpMap = map;
        zebar.shellExec('cmd.exe', ['/c', 'echo', ...map.split(' '), '>', '%TEMP%\\glazewm-jump-map.txt']);
      }

      function workspaceWindows(ws) {
        const wins = [];
        const walk = c => {
          if (c.type === 'window') wins.push(c);
          (c.children || []).forEach(walk);
        };
        (ws?.children || []).forEach(walk);
        return wins;
      }

      // Systray tooltip substrings to hide. Case-insensitive. Zebar's visibility
      // filter is racy (TBSTATE_HIDDEN is read via message events that fire
      // sparsely), so we enforce our own stable blocklist.
      const SYSTRAY_BLOCKLIST = [
        'microsoft defender',
        'icue',
        'logitech g hub',
        'sonic suite companion',
        'glaze',
        'zebar',
        'tacky-borders',
        'bluetooth 장치',
        '스피커',
        '배터리 상태',
        'microsoft 365 copilot',
      ];
      function isBlockedTrayIcon(tooltip) {
        const t = (tooltip || '').toLowerCase();
        return SYSTRAY_BLOCKLIST.some(b => t.includes(b));
      }

      // zebar drops a tray icon only on NIM_DELETE, so an app that dies without
      // one leaves a ghost and a restart adds a duplicate (glzr-io/zebar#288).
      const TRAY_DEAD_ERROR = 'Unable to send event to icon.';
      const TRAY_PROBE_MS = 15000;
      const TRAY_CLICK_QUIET_MS = 30000;
      let lastTrayClick = 0;

      function useDeadTrayIcons(idsKey) {
        const [dead, setDead] = useState(() => new Set());
        useEffect(() => {
          let alive = true;
          const probe = async () => {
            const tray = providers.outputMap.systray;
            if (!tray || Date.now() - lastTrayClick < TRAY_CLICK_QUIET_MS) return;
            const found = await Promise.all(
              tray.icons.filter(i => !isBlockedTrayIcon(i.tooltip)).map(i =>
                tray.onHoverLeave(i.id).then(
                  () => null,
                  e => (String(e?.message ?? e).includes(TRAY_DEAD_ERROR) ? i.id : null),
                ),
              ),
            );
            if (!alive) return;
            const next = found.filter(Boolean);
            setDead(prev =>
              next.length === prev.size && next.every(id => prev.has(id)) ? prev : new Set(next),
            );
          };
          probe();
          const id = setInterval(probe, TRAY_PROBE_MS);
          return () => { alive = false; clearInterval(id); };
        }, [idsKey]);
        return dead;
      }

      const CAT_FRAME_URLS = [0, 1, 2, 3, 4].map(
        i => `https://cdn.jsdelivr.net/gh/Kyome22/menubar_runcat@master/resources/cat/png/${i}.png`
      );

      const SPARK_SAMPLES = 30;
      const SPARK_W = 44;
      const SPARK_H = 14;

      function Sparkline({ reading, color, gradId }) {
        const [samples, setSamples] = useState([]);
        useEffect(() => {
          if (reading.usage == null) return;
          setSamples(prev => [...prev, reading.usage].slice(-SPARK_SAMPLES));
        }, [reading]);

        if (samples.length < 2) return null;

        const pts = samples.map((v, i) => {
          const x = (i / (SPARK_SAMPLES - 1)) * SPARK_W;
          const y = SPARK_H - (Math.min(100, Math.max(0, v)) / 100) * SPARK_H;
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        });
        const line = `M ${pts.join(' L ')}`;
        const area = `M ${pts[0].split(',')[0]},${SPARK_H} L ${pts.join(' L ')} L ${SPARK_W},${SPARK_H} Z`;

        return (
          <svg className="sparkline" viewBox={`0 0 ${SPARK_W} ${SPARK_H}`} preserveAspectRatio="none">
            <defs>
              <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%"  stopColor={color} stopOpacity="0.55" />
                <stop offset="100%" stopColor={color} stopOpacity="0" />
              </linearGradient>
            </defs>
            <path d={area} fill={`url(#${gradId})`} />
            <path d={line} fill="none" stroke={color} strokeWidth="1" strokeLinejoin="round" strokeLinecap="round" />
          </svg>
        );
      }

      const baseUsageColors = {
        CPU: 'rgb(140, 190, 255)',
        Memory: 'rgb(180, 220, 150)',
        GPU: 'rgb(212, 162, 255)',
      };

      function UsageStat({ name, reading, children }) {
        if (!reading) return null;
        const percent = Math.round(reading.usage);
        let color = baseUsageColors[name];
        if (percent >= 90) color = 'rgb(255, 120, 120)';
        else if (percent >= 75) color = 'rgb(255, 170, 100)';
        else if (percent >= 50) color = 'rgb(230, 210, 120)';

        return (
          <span className={`stat compact usage${name === 'CPU' ? ' divider-left' : ''}`} title={name} style={{ color }}>
            {children}
            <span className="metric">{percent}%</span>
            <Sparkline reading={reading} color={name === 'GPU' ? baseUsageColors.GPU : color} gradId={`sp-${name}`} />
          </span>
        );
      }

      function useGpu() {
        const [gpu, setGpu] = useState(null);
        useEffect(() => {
          const topic = 'dotfiles.mac-bar.gpu';
          const channel = new BroadcastChannel(topic);
          const controller = new AbortController();
          const { signal } = controller;
          const stopped = new Promise(resolve => signal.addEventListener('abort', resolve, { once: true }));

          function display(usage) {
            if (usage === null || (Number.isFinite(usage) && usage >= 0 && usage <= 100)) {
              setGpu(usage === null ? null : { usage });
            }
          }
          channel.onmessage = event => display(event.data);
          function publish(usage) {
            if (signal.aborted) return;
            display(usage);
            channel.postMessage(usage);
          }

          async function collect() {
            const cwd = zebar.currentWidget().htmlPath.replace(/[^\\/]+$/, '');
            let sampler;
            let sampled = false;
            try {
              sampler = await zebar.shellSpawn('powershell.exe',
                ['-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', '.\\gpu-usage.ps1'], { cwd });
              if (signal.aborted) return false;
              // Zebar 3.0.3 sends "processId" for write/kill; the 3.3.1 desktop commands require "pid".
              const pid = sampler.processId;
              const ended = new Promise(resolve => {
                const next = () => invoke('shell_write', { pid, buffer: '\n' }).catch(resolve);
                sampler.onExit(() => { sampler = null; resolve(); });
                sampler.onStdout(line => {
                  if (signal.aborted || !line.trim()) return;
                  const usage = Number(line);
                  if (Number.isFinite(usage) && usage >= 0 && usage <= 100) {
                    sampled = true;
                    publish(usage);
                  }
                  next();
                });
                next();
              });
              await Promise.race([ended, stopped]);
            } finally {
              if (sampler) await invoke('shell_kill', { pid: sampler.processId }).catch(() => {});
            }
            return sampled;
          }

          async function ownSampler() {
            publish(null);
            let sampled;
            do {
              sampled = await collect().catch(() => false);
              publish(null);
            } while (sampled && !signal.aborted);
            // Hold the lock on GPU-less PCs so other monitors don't repeat the probe.
            await stopped;
          }
          navigator.locks.request(topic, { signal }, ownSampler).catch(() => {});
          function stop() {
            controller.abort();
            channel.close();
          }
          window.addEventListener('pagehide', stop);
          return () => { window.removeEventListener('pagehide', stop); stop(); };
        }, []);
        return gpu;
      }

      function ImeBadge() {
        const [ime, setIme] = useState(null);
        useEffect(() => {
          let closed = false;
          let watcher;
          let timer;
          let polling = false;
          function update(text) {
            const state = text.trim();
            if (!closed && (state === 'KO' || state === 'EN')) setIme(state);
          }
          async function poll() {
            try {
              const r = await fetch('./ime-state.txt', { cache: 'no-store' });
              if (r.ok) update(await r.text());
            } catch { /* AHK may still be starting. */ }
            if (!closed) timer = setTimeout(poll, 400);
          }
          function fallback() {
            if (closed || polling) return;
            polling = true;
            clearTimeout(timer);
            if (watcher) invoke('shell_kill', { pid: watcher.processId }).catch(() => {});
            watcher = null;
            poll();
          }
          function stop() {
            closed = true;
            clearTimeout(timer);
            if (watcher) invoke('shell_kill', { pid: watcher.processId }).catch(() => {});
            watcher = null;
          }
          async function connect() {
            const cwd = zebar.currentWidget().htmlPath.replace(/[^\\/]+$/, '');
            const child = await zebar.shellSpawn('C:\\Program Files\\AutoHotkey\\v2\\AutoHotkey64.exe',
              ['/ErrorStdOut', '.\\watch-ime.ahk'], { cwd });
            watcher = child;
            if (closed) { stop(); return; }
            let received = false;
            child.onStdout(line => {
              if (!['KO', 'EN'].includes(line.trim())) return;
              received = true;
              update(line);
            });
            child.onExit(() => {
              watcher = null;
              if (closed || polling) return;
              if (received) timer = setTimeout(start, 4000);
              else fallback();
            });
            await invoke('shell_write', { pid: child.processId, buffer: '\n' });
          }
          function start() {
            connect().catch(fallback);
          }
          start();
          window.addEventListener('pagehide', stop);
          return () => { window.removeEventListener('pagehide', stop); stop(); };
        }, []);
        return ime && <span className={`ime divider-left ime-${ime.toLowerCase()}`}>{ime}</span>;
      }

      const CAT_MIN_FPS = 4;
      const CAT_MAX_FPS = SOFT_RENDER ? 10 : 30;
      const CAT_HUE_DEG_PER_MS = 0.12;

      function RunCat({ cpuUsage }) {
        const [tick, setTick] = useState(0);
        const frameMs = useRef(0);
        const load = Math.min(100, Math.max(0, cpuUsage ?? 0)) / 100;
        frameMs.current = 1000 / (CAT_MIN_FPS + (CAT_MAX_FPS - CAT_MIN_FPS) * load);
        useEffect(() => {
          // Preload all frames once
          CAT_FRAME_URLS.forEach(u => { const img = new Image(); img.src = u; });
        }, []);
        useEffect(() => {
          let id;
          const step = () => {
            setTick(t => t + 1);
            id = setTimeout(step, frameMs.current);
          };
          id = setTimeout(step, frameMs.current);
          return () => clearTimeout(id);
        }, []);
        return <img className="runcat" style={{ '--cat-hue': `${Math.round(performance.now() * CAT_HUE_DEG_PER_MS) % 360}deg` }}
          src={CAT_FRAME_URLS[tick % CAT_FRAME_URLS.length]} alt="" />;
      }

      const MARKET_POLL_MS = 10 * 60 * 1000;
      const QUOTES_POLL_MS = 20 * 1000;
      const MARKET_STALE_DAYS = 5;
      const HOVER_OPEN_MS = 150;
      const HOVER_CLOSE_MS = 200;

      const ABSENT_POLL_MS = 10 * 60 * 1000;

      function useJson(path, pollMs, version = 0) {
        const [data, setData] = useState(null);
        const last = useRef('');
        useEffect(() => {
          if (!path) return;
          let alive = true;
          let id;
          async function load() {
            let next = pollMs;
            try {
              const r = await fetch(path, { cache: 'no-store' });
              const text = r.ok ? await r.text() : '';
              if (!text) next = ABSENT_POLL_MS;
              if (alive && text !== last.current) {
                setData(text ? JSON.parse(text) : null);
                last.current = text;
              }
            } catch {}
            if (alive) id = setTimeout(load, next);
          }
          load();
          return () => { alive = false; clearTimeout(id); };
        }, [path, pollMs, version]);
        return data;
      }

      class MarketBoundary extends React.Component {
        state = { failed: false };
        static getDerivedStateFromError() { return { failed: true }; }
        render() { return this.state.failed ? null : this.props.children; }
      }

      const PIN_LOCK = 'dotfiles.mac-bar.market-pin';
      const PIN_WARM = 'dotfiles.mac-bar.market-pin-warm';
      const PIN_SHOW = 'dotfiles.mac-bar.market-pin-show';
      const PIN_READY_MS = 8000;
      const PIN_SPOT = 'mac-bar.market.pin-spot';

      async function isHeld(name) {
        const { held } = await navigator.locks.query();
        return held.some(lock => lock.name === name);
      }

      function post(name, message) {
        const channel = new BroadcastChannel(name);
        channel.postMessage(message);
        channel.close();
      }

      function readSpot() {
        try { return JSON.parse(localStorage.getItem(PIN_SPOT)); } catch { return null; }
      }

      function saveSpot(spot) {
        try { localStorage.setItem(PIN_SPOT, JSON.stringify(spot)); } catch {}
      }

      function useHoverPanel() {
        const [visible, setVisible] = useState(false);
        const [left, setLeft] = useState(0);
        const trigger = useRef(null);
        const panel = useRef(null);
        const wanted = useRef(false);
        const base = useRef(null);
        const queue = useRef(Promise.resolve());
        const timer = useRef(null);

        const apply = useCallback(async () => {
          const win = zebar.currentWidget().window;
          if (wanted.current && !base.current && panel.current && trigger.current) {
            if (await isHeld(PIN_LOCK)) { wanted.current = false; return; }
            const box = trigger.current.getBoundingClientRect();
            const { offsetWidth: w, offsetHeight: h, offsetTop: top } = panel.current;
            const size = await win.tauri.innerSize();
            base.current = { type: 'Physical', width: size.width, height: size.height };
            setLeft(Math.max(8, Math.min(box.left + box.width / 2 - w / 2, window.innerWidth - w - 8)));
            await win.tauri.setSize({ ...base.current, height: Math.ceil((top + h + 8) * window.devicePixelRatio) });
            await win.setZOrder('top_most');
            setVisible(true);
          } else if (!wanted.current && base.current) {
            setVisible(false);
            const restore = base.current;
            await win.setZOrder('normal').catch(() => {});
            await win.tauri.setSize(restore);
            base.current = null;
          }
        }, []);

        const holding = useRef(false);
        const request = useCallback((open, delay) => {
          if (holding.current) return;
          clearTimeout(timer.current);
          timer.current = setTimeout(() => {
            wanted.current = open;
            queue.current = queue.current.then(apply).catch(() => {
              wanted.current = false;
              if (!base.current) return;
              setVisible(false);
              return zebar.currentWidget().window.tauri.setSize(base.current)
                .then(() => { base.current = null; }).catch(() => {});
            });
          }, delay);
        }, [apply]);

        const enter = useCallback(() => request(true, HOVER_OPEN_MS), [request]);
        const leave = useCallback(() => request(false, HOVER_CLOSE_MS), [request]);
        const show = useCallback(() => request(true, 0), [request]);
        const pin = useCallback(async () => {
          const box = panel.current.getBoundingClientRect();
          const at = await zebar.currentWidget().window.tauri.outerPosition();
          const scale = window.devicePixelRatio;
          saveSpot({ right: Math.round(at.x + box.right * scale), y: Math.round(at.y + box.top * scale) });
          const channel = new BroadcastChannel(PIN_LOCK);
          const ready = new Promise(resolve => {
            channel.onmessage = resolve;
            setTimeout(resolve, PIN_READY_MS);
          });
          clearTimeout(timer.current);
          holding.current = true;
          try {
            if (await isHeld(PIN_WARM)) post(PIN_SHOW, 'show');
            else await zebar.startWidgetPreset('market', 'pinned');
            await ready;
          } finally {
            channel.close();
            holding.current = false;
            request(false, 60);
          }
        }, [request]);
        useEffect(() => {
          const close = () => request(false, 0);
          const onKey = e => { if (e.key === 'Escape') close(); };
          window.addEventListener('keydown', onKey);
          document.documentElement.addEventListener('pointerleave', leave);
          return () => {
            clearTimeout(timer.current);
            window.removeEventListener('keydown', onKey);
            document.documentElement.removeEventListener('pointerleave', leave);
          };
        }, [request, leave]);
        return { visible, left, trigger, panel, enter, leave, show, pin };
      }

      const NAMES = { fear: '공포', crowd: '쏠림', orbit: '궤도' };
      const signed = (v, digits = 0) => `${v > 0 ? '+' : ''}${v.toFixed(digits)}%`;
      const marketLevel = v => (v >= 80 ? '매우 높음' : v >= 60 ? '높음' : v >= 40 ? '보통' : v >= 20 ? '낮음' : '매우 낮음');
      const isStale = asof => Date.now() - new Date(`${asof}T21:00:00Z`).getTime() > MARKET_STALE_DAYS * 86400000;

      const TICK_W = 44;
      const TICK_H = 11;
      const TICK_DAYS = 63;

      function Tick({ axis, value, history }) {
        const low = Math.min(...history);
        const range = Math.max(...history) - low || 1;
        const line = history
          .map((v, i) => `${i ? 'L' : 'M'}${(i / (history.length - 1) * TICK_W).toFixed(1)},${(TICK_H - 1 - (v - low) / range * (TICK_H - 2)).toFixed(1)}`)
          .join(' ');
        return (
          <span className={`mk-tick ${axis}`} aria-hidden="true">
            <span className="mk-tick-top">{NAMES[axis]}<b>{value}</b></span>
            <svg width={TICK_W} height={TICK_H}>
              <defs>
                <linearGradient id={`mk-tick-${axis}`} x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopOpacity="0.5" />
                  <stop offset="100%" stopOpacity="0" />
                </linearGradient>
              </defs>
              <path d={`${line} L${TICK_W},${TICK_H} L0,${TICK_H} Z`} fill={`url(#mk-tick-${axis})`} />
              <path className="line" d={line} />
            </svg>
          </span>
        );
      }

      const ARC_PATH = 'M3 15.500A13 13 0 0 1 29 15.500';

      function Gauge({ axis, value, kind }) {
        if (kind === 'pill') {
          return (
            <span className={`mk-gauge ${axis}`} aria-hidden="true">
              <span>{NAMES[axis]}</span>
              <span className="mk-pill"><span style={{ width: `${value}%` }}></span><b>{value}</b></span>
            </span>
          );
        }
        return (
          <span className={`mk-gauge ${axis}`} aria-hidden="true">
            <span>{NAMES[axis]}</span>
            <svg width="29" height="17" viewBox="1.5 0 29 17">
              <path d={ARC_PATH} pathLength="100" />
              {value > 0 && <path className="on" d={ARC_PATH} pathLength="100" strokeDasharray={`${value} 200`} />}
              <text x="16" y="15.5">{value}</text>
            </svg>
          </span>
        );
      }

      function BadgeRows({ rows }) {
        return (
          <span className="mk-badges" aria-hidden="true">
            {rows.map(([key, name, from, to, text]) => (
              <span key={key} className={AXES.includes(key) ? key : `orbit ${to > 50 ? 'over' : 'under'}`}>
                {name}
                <b><i style={{ left: `${from}%`, width: `${to - from}%` }}></i><span>{text}</span></b>
              </span>
            ))}
          </span>
        );
      }

      const QUOTE_TICK_W = 64;
      const DAY_TICK_H = 12;

      function dayShape(quote, width, height) {
        const points = quote.day?.length > 1 ? quote.day : quote.m3;
        const base = quote.day?.length > 1 ? quote.prev : points[0];
        const slots = Math.max(quote.day?.length > 1 && quote.full ? quote.full : points.length, points.length);
        const low = Math.min(...points, base);
        const high = Math.max(...points, base);
        const x = i => i / (slots - 1) * width;
        const y = v => 1 + (high - v) / (high - low || 1) * (height - 2);
        const line = points.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
        return { line, area: `${line} L${x(points.length - 1).toFixed(1)},${y(base).toFixed(1)} L0,${y(base).toFixed(1)} Z`, baseY: y(base) };
      }

      function DayLine({ quote, width, height }) {
        const { line, area, baseY } = dayShape(quote, width, height);
        return (
          <svg className={toneOf(quote.chg)} width={width} height={height} aria-hidden="true">
            <line className="base" x1="0" x2={width} y1={baseY} y2={baseY} />
            <path className="fill" d={area} />
            <path className="line" d={line} />
          </svg>
        );
      }

      function QuoteTick({ quote, value }) {
        const text = value === 'price' ? formatPrice(quote.price, Math.min(quote.digits, 2)) : formatDelta(quote.chg, quote.unit);
        return (
          <span className={`mk-tick quote ${toneOf(quote.chg)} ${quote.stale ? 'stale' : ''}`} aria-hidden="true">
            <span className="mk-tick-top">{quote.short ?? quote.name}<b>{text}</b></span>
            <DayLine quote={quote} width={QUOTE_TICK_W} height={DAY_TICK_H} />
          </span>
        );
      }

      const MarketStat = React.memo(function MarketStat({ market, quotes, items, triggerRef, open, onEnter, onLeave, onClick }) {
        const [value] = useStored('bar-value', keysOf(BAR_VALUES), 'chg');
        const [kind] = useStored('bar-gauge', keysOf(BAR_STYLES), 'rows');
        const main = market.indices[0];
        const gauges = [
          ['fear', main.fear, main.fearHist.slice(-TICK_DAYS)],
          ['crowd', main.crowd, main.crowdHist.slice(-TICK_DAYS)],
        ].filter(([axis]) => items.includes(axis));
        const orbits = market.indices.filter(i => items.includes(orbitKey(i))).map(i => [i.key, i.name, i.trend.dev]);
        const picked = quotesOf(quotes).filter(q => items.includes(q.key));
        const label = [...gauges.map(([axis, v]) => `${NAMES[axis]} ${v}`), ...orbits.map(([, name, v]) => `${NAMES.orbit} ${name} ${signed(v)}`), ...picked.map(q => `${q.name} ${formatDelta(q.chg, q.unit)}`)].join(', ');
        return (
          <button
            ref={triggerRef}
            aria-label={label || '시장 온도계'}
            className={`stat market divider-left ${isStale(market.asof) ? 'stale' : ''}`}
            aria-expanded={open}
            aria-controls="market-panel"
            onPointerEnter={onEnter}
            onPointerLeave={onLeave}
            onClick={onClick}
          >
            {kind === 'rows' && gauges.length > 0 && <BadgeRows rows={gauges.map(([axis, v]) => [axis, NAMES[axis], 0, v, v])} />}
            {kind !== 'rows' && gauges.map(([axis, v, history]) => (kind === 'trend'
              ? <Tick key={axis} axis={axis} value={v} history={history} />
              : <Gauge key={axis} axis={axis} value={v} kind={kind} />))}
            {orbits.length > 0 && <BadgeRows rows={orbits.map(([key, name, v]) => [key, name, Math.min(50, dialAt(v)), Math.max(50, dialAt(v)), signed(v)])} />}
            {picked.map(q => <QuoteTick key={q.key} quote={q} value={value} />)}
            {!label && <span>시장</span>}
          </button>
        );
      });

      function Meter({ axis, value }) {
        const name = NAMES[axis];
        return (
          <div className={`mk-meter ${axis}`}>
            <span className="mk-name"><span className={`dot ${axis}`}></span><Help id={axis}>{name}</Help></span>
            <span className="mk-track" role="meter" aria-label={name} aria-valuemin="0" aria-valuemax="100" aria-valuenow={value}>
              <span className="mk-fill" style={{ width: `${value}%` }}></span>
            </span>
            <b className="mk-num">{value}</b>
            <span className="mk-level">{marketLevel(value)}</span>
          </div>
        );
      }

      const CHART_W = 340;

      function useScrub(count) {
        const [at, setAt] = useState(null);
        return [at, {
          onPointerMove: e => {
            const box = e.currentTarget.getBoundingClientRect();
            const ratio = Math.max(0, Math.min(1, (e.clientX - box.left) / box.width));
            setAt(Math.round(ratio * (count - 1)));
          },
          onPointerLeave: () => setAt(null),
        }];
      }

      const chartX = (i, count) => i / (count - 1) * CHART_W;
      const chartPath = (values, y) => values
        .map((v, i) => `${i ? 'L' : 'M'}${chartX(i, values.length).toFixed(1)},${y(v).toFixed(1)}`)
        .join(' ');

      function useStored(key, options, initial) {
        const name = `mac-bar.market.${key}`;
        const [value, setValue] = useState(() => {
          try {
            const saved = localStorage.getItem(name);
            return options.includes(saved) ? saved : initial;
          } catch { return initial; }
        });
        const update = useCallback(next => {
          try { localStorage.setItem(name, next); } catch {}
          window.dispatchEvent(new StorageEvent('storage', { key: name, newValue: next }));
        }, [name]);
        useEffect(() => {
          const sync = e => { if (e.key === name && options.includes(e.newValue)) setValue(e.newValue); };
          window.addEventListener('storage', sync);
          return () => window.removeEventListener('storage', sync);
        }, [name, options.join()]);
        return [value, update];
      }

      const AXES = ['fear', 'crowd'];
      const orbitKey = index => `orbit:${index.key}`;
      const ORBIT_KEYS = ['orbit:IXIC', 'orbit:GSPC'];
      const BAR_DEFAULT = [...AXES, ...ORBIT_KEYS, '^IXIC', '^GSPC'];
      const BAR_VALUES = [['chg', '등락률'], ['price', '가격']];
      const BAR_STYLES = [['rows', '가로 막대'], ['arc', '반원'], ['pill', '캡슐'], ['trend', '추이']];
      const quotesOf = quotes => (quotes ? quotes.groups.flatMap(g => g.items) : []);

      function useBarItems() {
        const name = 'mac-bar.market.bar-items';
        const read = () => {
          try {
            const saved = JSON.parse(localStorage.getItem(name));
            return Array.isArray(saved) ? saved.flatMap(key => (key === 'orbit' ? ORBIT_KEYS : [key])) : BAR_DEFAULT;
          } catch { return BAR_DEFAULT; }
        };
        const [items, setItems] = useState(read);
        useEffect(() => {
          const sync = e => { if (e.key === name) setItems(read()); };
          window.addEventListener('storage', sync);
          return () => window.removeEventListener('storage', sync);
        }, []);
        const toggle = useCallback(key => {
          const now = read();
          const next = now.includes(key) ? now.filter(k => k !== key) : [...now, key];
          setItems(next);
          try { localStorage.setItem(name, JSON.stringify(next)); } catch {}
        }, []);
        return [items, toggle];
      }

      function BarSettings({ indices, quotes, items, onToggle }) {
        const [value, setValue] = useStored('bar-value', keysOf(BAR_VALUES), 'chg');
        const [style, setStyle] = useStored('bar-gauge', keysOf(BAR_STYLES), 'rows');
        const chip = (key, text) => (
          <button key={key} className="mk-chip" aria-pressed={items.includes(key)} onClick={() => onToggle(key)}>{text}</button>
        );
        return (
          <div className="mk-settings" role="dialog" aria-label="바에 표시할 항목">
            <h3>바에 표시할 항목</h3>
            <p>온도계</p>
            <div>{AXES.map(axis => chip(axis, NAMES[axis]))}{indices.map(i => chip(orbitKey(i), `${NAMES.orbit} ${i.name}`))}</div>
            {quotes?.groups.map(g => (
              <React.Fragment key={g.group}>
                <p>{g.group}</p>
                <div>{g.items.map(q => chip(q.key, q.name))}</div>
              </React.Fragment>
            ))}
            <p>공포·쏠림 모양</p>
            <Choice kind="tabs" label="온도계 모양" options={BAR_STYLES} value={style} onChange={setStyle} />
            <p>시세 값</p>
            <Choice kind="tabs" label="바 시세 값" options={BAR_VALUES} value={value} onChange={setValue} />
          </div>
        );
      }

      function Choice({ kind, label, options, value, onChange }) {
        return (
          <div className={`mk-choice ${kind}`} role="group" aria-label={label}>
            {options.map(([key, text]) => (
              <button key={key} aria-pressed={key === value} onClick={() => onChange(key)}>{text}</button>
            ))}
          </div>
        );
      }

      const MOOD_RANGES = [['6m', '6개월', 126], ['1y', '1년', 252], ['3y', '3년', 756], ['5y', '5년', 1260]];
      const ORBIT_RANGES = [['5y', '5년', 260], ['10y', '10년', 520], ['20y', '20년', 1040], ['all', '전체', Infinity]];
      const ORBIT_LINES = [55, 15, -15, -30];
      const ORBIT_ZONES = ['크게 과평가', '과평가', '적정', '저평가', '크게 저평가'];
      const ORBIT_VIEWS = [['dev', '괴리'], ['price', '지수'], ['both', '비교'], ['then', '당시']];
      const aheadText = (dev, rate) => {
        const years = Math.log1p(dev / 100) / Math.log1p(rate / 100);
        return `${Math.abs(years).toFixed(1)}년 ${years < 0 ? '뒤처짐' : '앞섬'}`;
      };
      const keysOf = options => options.map(o => o[0]);
      const sizeOf = (options, key) => options.find(o => o[0] === key)[2];

      const MAX_POINTS = 420;
      function thin(values) {
        const stride = Math.ceil(values.length / MAX_POINTS);
        return values.filter((_, i) => (values.length - 1 - i) % stride === 0);
      }

      function rolling(values, size) {
        if (size === 1) return values;
        return values.map((_, i) => {
          const part = values.slice(Math.max(0, i - size + 1), i + 1);
          return Math.round(part.reduce((sum, v) => sum + v, 0) / part.length);
        });
      }

      const MoodChart = React.memo(function MoodChart({ index }) {
        const [range, setRange] = useStored('mood-range', keysOf(MOOD_RANGES), '6m');
        const size = sizeOf(MOOD_RANGES, range);
        const span = size > 252 ? 10 : size > 126 ? 5 : 1;
        const fear = thin(rolling(index.fearHist, span).slice(-size));
        const crowd = thin(rolling(index.crowdHist, span).slice(-size));
        const dates = thin(index.histDates.slice(-size));
        const [at, scrub] = useScrub(fear.length);
        const shown = Math.min(at ?? fear.length - 1, fear.length - 1);
        const h = 122;
        const y = v => h - v / 100 * h;
        return (
          <div className="mk-chart">
            <div className="mk-read">
              <span className="mk-inline"><Choice kind="range" label="공포·쏠림 기간" options={MOOD_RANGES} value={range} onChange={setRange} /><Help id="mood" /></span>
              <span>{at != null ? <span>20{dates[shown]}</span> : span > 1 && <span>{span / 5}주 평균</span>}<i className="key fear"></i>{NAMES.fear}<b>{fear[shown]}</b><i className="key crowd"></i>{NAMES.crowd}<b>{crowd[shown]}</b></span>
            </div>
            <div className="mk-plot">
              <svg viewBox={`0 -2 ${CHART_W} ${h + 4}`} height={h + 4} preserveAspectRatio="none" aria-hidden="true" {...scrub}>
                {[20, 50, 80].map(v => <line key={v} className={v === 50 ? 'far' : 'guide'} x1="0" x2={CHART_W} y1={y(v)} y2={y(v)} />)}
                <path className="area fear" d={`${chartPath(fear, y)} L${CHART_W},${h} L0,${h} Z`} />
                <path className="crowd" d={chartPath(crowd, y)} />
                <path className="fear" d={chartPath(fear, y)} />
                {at != null && <line className="cross" x1={chartX(shown, fear.length)} x2={chartX(shown, fear.length)} y1="0" y2={h} />}
              </svg>
              <div className="mk-guides" aria-hidden="true">
                {[20, 50, 80].map(v => <span key={v} style={{ top: y(v) + 2 }}>{v}</span>)}
              </div>
            </div>
          </div>
        );
      });

      const zoneIndex = dev => ORBIT_LINES.filter(v => (v > 0 ? dev < v : dev <= v)).length;
      const orbitZone = dev => ORBIT_ZONES[zoneIndex(dev)];
      const lineTone = n => `z${n < 2 ? n : n + 1}`;

      function weekDates({ weekEnd, weekDev }, asof) {
        const tail = asof !== weekEnd ? 1 : 0;
        const end = Date.parse(`${weekEnd}T00:00:00Z`);
        const fridays = weekDev.length - tail;
        const dates = Array.from({ length: fridays }, (_, i) =>
          new Date(end - (fridays - 1 - i) * 7 * 86400000).toISOString().slice(0, 10));
        return tail ? [...dates, asof] : dates;
      }

      const thousands = v => Math.round(v).toLocaleString('en-US');

      const DIAL_EDGES = [-50, ...[...ORBIT_LINES].reverse(), 100];
      const dialAt = v => {
        const [low, high] = [DIAL_EDGES[0], DIAL_EDGES.at(-1)].map(e => Math.log1p(e / 100));
        return 100 * (Math.log1p(Math.max(DIAL_EDGES[0], Math.min(DIAL_EDGES.at(-1), v)) / 100) - low) / (high - low);
      };

      function PeakLine({ peak }) {
        if (peak?.usd == null) return null;
        return (
          <div className="mk-peak">
            1년 고점 대비<b>{signed(peak.usd, 1)}</b>
            {peak.krw != null && <>·<span>원화로는</span><b>{signed(peak.krw, 1)}</b></>}
            <Help id="peak" />
          </div>
        );
      }

      function OrbitDial({ trend }) {
        const { dev, span } = trend;
        const zone = zoneIndex(dev);
        return (
          <div className="mk-dial">
            <div className="mk-dial-top">
              <span><Help id="orbit">추세선</Help>보다 <b>{Math.abs(dev)}%</b> {dev > 0 ? '높음' : dev < 0 ? '낮음' : '차이'}{span && <small><Help id="orbitSpan">시작 연도별</Help> {signed(span.lo)} ~ {signed(span.hi)}</small>}</span>
              <b className={`z${zone}`}>{ORBIT_ZONES[zone]}</b>
            </div>
            <div className="mk-dial-bar" role="img" aria-label={`${signed(dev)}, ${ORBIT_ZONES[zone]}`}>
              {DIAL_EDGES.slice(0, -1).map((from, n) => {
                const to = DIAL_EDGES[n + 1];
                const k = ORBIT_LINES.length - n;
                return (
                  <span key={from} className={`z${k} ${k === zone ? 'on' : ''}`} style={{ left: `${dialAt(from)}%`, width: `${dialAt(to) - dialAt(from)}%` }}>{ORBIT_ZONES[k]}</span>
                );
              })}
              <i style={{ left: `${dialAt(dev)}%` }}></i>
            </div>
            <div className="mk-dial-marks" aria-hidden="true">
              {span && <i style={{ left: `${dialAt(span.lo)}%`, width: `${dialAt(span.hi) - dialAt(span.lo)}%` }}></i>}
              {ORBIT_LINES.map((v, n) => <span key={v} className={lineTone(n)} style={{ left: `${dialAt(v)}%` }}>{signed(v)}</span>)}
            </div>
          </div>
        );
      }

      const OrbitChart = React.memo(function OrbitChart({ index, other }) {
        const [range, setRange] = useStored('orbit-range', keysOf(ORBIT_RANGES), '5y');
        const [picked, setView] = useStored('orbit-view', keysOf(ORBIT_VIEWS), 'dev');
        const { trend } = index;
        const view = picked === 'then' && !trend.weekThen?.length ? 'dev' : picked;
        const lines = ORBIT_LINES;
        const total = (view === 'then' ? trend.weekThen : trend.weekDev).length;
        const size = Math.min(sizeOf(ORBIT_RANGES, range), total);
        const cut = values => thin(values.slice(-size));
        const dev = cut(trend.weekDev);
        const past = view === 'then' ? cut(trend.weekThen) : [];
        const price = cut(trend.weekPx);
        const allDates = useMemo(() => weekDates(trend, index.asof), [index]);
        const dates = cut(allDates);
        const rival = cut(other.trend.weekDev);
        const [at, scrub] = useScrub(dev.length);
        const shown = Math.min(at ?? dev.length - 1, dev.length - 1);

        const h = 194;
        const isPrice = view === 'price';
        const log = v => Math.log1p(v / 100);
        const fair = price.map((v, i) => Math.log(v) - log(dev[i]));
        const main = isPrice ? price.map(Math.log) : dev.map(log);
        const extra = (view === 'both' ? rival : past).map(log);
        const bounds = isPrice
          ? [...main, ...fair, fair.at(-1) + log(lines[0])]
          : [...main, ...extra, log(lines[0]) + 0.04, log(lines[3]) - 0.04];
        const top = Math.max(...bounds);
        const bottom = Math.min(...bounds);
        const y = v => (top - v) / (top - bottom) * h;
        const base = isPrice ? fair.at(-1) : 0;
        const edges = [top, ...lines.map(log), bottom].map(v => Math.max(bottom, Math.min(top, v)));
        const line = chartPath(main, y);
        const labels = [[base, '추세선'], ...[1, 2, 0, 3].map(n => [base + log(lines[n]), signed(lines[n]), lineTone(n)])];
        const placed = [];
        for (const [v, text, tone] of labels) {
          if (v > top || v < bottom || placed.some(o => Math.abs(o.at - y(v)) < 10.5)) continue;
          placed.push({ at: y(v), text, tone });
        }

        return (
          <div className="mk-chart orbit">
            <div className="mk-ctl">
              <span className="mk-inline"><Choice kind="tabs" label="보기" options={ORBIT_VIEWS} value={view} onChange={setView} /><Help id="orbitChart" /></span>
              <Choice kind="range" label="궤도 기간" options={ORBIT_RANGES} value={range} onChange={setRange} />
            </div>
            <div className="mk-read">
              <span>{at == null ? (isPrice ? `${index.name} (로그)` : '현재 추세선 대비') : dates[shown].replaceAll('-', '.')}</span>
              {view === 'dev' && <span><b>{signed(dev[shown])}</b>{orbitZone(dev[shown])}{trend.rate > 0 && ` · ${aheadText(dev[shown], trend.rate)}`}</span>}
              {isPrice && <span><b>{thousands(price[shown])}</b>추세선 {thousands(Math.exp(fair[shown]))}</span>}
              {view === 'both' && (
                <span>
                  <i className="key orbit"></i>{index.name}<b>{signed(dev[shown])}</b>
                  <i className="key rival"></i>{other.name}<b>{signed(rival[shown])}</b>
                </span>
              )}
              {view === 'then' && (
                <span>
                  <i className="key orbit"></i>지금 보면<b>{signed(dev[shown])}</b>
                  <i className="key rival"></i>그날 봤다면<b>{signed(past[shown])}</b>
                </span>
              )}
            </div>
            <div className="mk-plot">
              <svg viewBox={`0 -2 ${CHART_W} ${h + 4}`} height={h + 4} preserveAspectRatio="none" aria-hidden="true" {...scrub}>
                {!isPrice && ORBIT_ZONES.map((name, k) => edges[k] > edges[k + 1] && (
                  <rect key={name} className={`z${k}`} x="0" width={CHART_W} y={y(edges[k])} height={y(edges[k + 1]) - y(edges[k])} />
                ))}
                {view === 'dev' && <path className="area" d={`${line} L${CHART_W},${y(0)} L0,${y(0)} Z`} />}
                {!isPrice && lines.map((v, n) => log(v) <= top && log(v) >= bottom && (
                  <line key={v} className={`level ${lineTone(n)}`} x1="0" x2={CHART_W} y1={y(log(v))} y2={y(log(v))} />
                ))}
                {isPrice && lines.map((v, n) => <path key={v} className={`band ${lineTone(n)}`} d={chartPath(fair.map(f => f + log(v)), y)} />)}
                {isPrice ? <path className="fair" d={chartPath(fair, y)} /> : <line className="zero" x1="0" x2={CHART_W} y1={y(0)} y2={y(0)} />}
                {extra.length > 0 && <path className="rival" d={chartPath(extra, y)} />}
                <path className="orbit" d={line} />
                {at != null && <line className="cross" x1={chartX(shown, dev.length)} x2={chartX(shown, dev.length)} y1="0" y2={h} />}
              </svg>
              <div className="mk-guides" aria-hidden="true">
                {placed.map(o => <span key={o.text} className={o.tone} style={{ top: o.at + 2 }}>{o.text}</span>)}
              </div>
            </div>
            <div className="mk-axis"><span>{dates[0].slice(0, 7).replace('-', '.')}</span>{view === 'then'
              ? <span>흰 선은 그날 이 그래프를 봤다면 나왔을 값</span>
              : <span><b className="z0">빨간 선</b> 위 과평가 · <b className="z4">파란 선</b> 아래 저평가</span>}<span>현재</span></div>
          </div>
        );
      });

      function ZoneTable({ indices }) {
        const all = indices.flatMap(i => AXES.flatMap(axis => [i.zone[axis].worst, i.zone[axis].p90]));
        const low = Math.min(0, ...all);
        const high = Math.max(0, ...all);
        const at = v => (v - low) / (high - low) * 100;
        return (
          <table className="mk-zones">
            <thead><tr><td></td><th scope="col"><i className="worst"></i>최악<i className="span"></i>10번 중 8번</th><th scope="col">하위 10%</th><th scope="col">가운데</th><th scope="col">20% 하락</th></tr></thead>
            {AXES.map(axis => (
              <tbody key={axis} className={axis}>
                <tr><th scope="rowgroup" colSpan="5"><span className={`dot ${axis}`}></span>{NAMES[axis]} {indices[0].zone[axis].lo}–{indices[0].zone[axis].hi}이던 날</th></tr>
                {indices.map(i => {
                  const z = i.zone[axis];
                  return (
                    <tr key={i.key}>
                      <th scope="row">{i.name}</th>
                      <td>
                        <span className="mk-range">
                          <i className="base" style={{ left: `${at(0)}%` }}></i>
                          <i className="tail" style={{ left: `${at(z.worst)}%`, width: `${at(z.p10) - at(z.worst)}%` }}></i>
                          <i className="worst" style={{ left: `${at(z.worst)}%` }}></i>
                          <i className="span" style={{ left: `${at(z.p10)}%`, width: `${at(z.p90) - at(z.p10)}%` }}></i>
                          <i className="mid" style={{ left: `${at(z.med)}%` }}></i>
                          <small className="from" style={{ right: `${100 - at(z.worst)}%` }}>{signed(z.worst)}</small>
                          <small style={{ left: `${at(z.p90)}%` }}>{signed(z.p90)}</small>
                        </span>
                      </td>
                      <td>{signed(z.p10)}</td>
                      <td><b>{signed(z.med)}</b></td>
                      <td>{z.dd20}%</td>
                    </tr>
                  );
                })}
              </tbody>
            ))}
          </table>
        );
      }

      const signalTag = sig => (sig.pending ? '월말 확정 전' : sig.on ? (sig.months ? `${sig.months}개월째` : '켜짐') : null);

      function SignalTable({ signals }) {
        const groups = [true, false].map(verified => signals.filter(sig => sig.verified === verified));
        return (
          <table className="mk-signals">
            <colgroup><col className="dot-col" /><col /><col className="now-col" /><col className="rate-col" /><col className="rate-col" /></colgroup>
            <thead><tr><td></td><td></td><th scope="col">지금 값</th><th scope="col">켜졌을 때</th><th scope="col">평소</th></tr></thead>
            {groups.map((rows, i) => rows.length > 0 && (
              <tbody key={i}>
                {!rows[0].verified && <tr className="group"><th scope="rowgroup" colSpan="5">참고 (우연과 구분 안 됨)</th></tr>}
                {rows.map(sig => (
                  <tr key={sig.label} className={sig.on ? 'on' : ''}>
                    <td><span className="mk-sig-dot" role="img" aria-label={sig.on ? '켜짐' : '꺼짐'}></span></td>
                    <th scope="row"><Help id={sig.label}>{sig.label}</Help>{signalTag(sig) && <small>{signalTag(sig)}</small>}</th>
                    <td>{sig.value || '–'}</td>
                    <td>{sig.hit}%</td>
                    <td>{sig.base}%</td>
                  </tr>
                ))}
              </tbody>
            ))}
          </table>
        );
      }

      const QUOTE_W = 104;
      const QUOTE_H = 32;
      const ROW_VIEWS = [['day', '오늘'], ['m3', '3개월']];
      const DAY_S = 86400;
      const QUOTE_RANGES = [['1d', '오늘', 0], ['1m', '1개월', 31], ['3m', '3개월', 92], ['6m', '6개월', 183], ['1y', '1년', 365], ['3y', '3년', 1096], ['5y', '5년', 1827]];

      function scaled(values, width, height) {
        const low = Math.min(...values);
        const range = Math.max(...values) - low || 1;
        const x = i => i / (values.length - 1) * width;
        const y = v => height - 2 - (v - low) / range * (height - 4);
        return { x, y, line: values.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ') };
      }

      function startIndex(days, span) {
        const end = Date.parse(`20${days.at(-1).replaceAll('.', '-')}T00:00:00Z`);
        const from = new Date(end - span * 86400000).toISOString().slice(2, 10).replaceAll('-', '.');
        return Math.max(0, days.findIndex(d => d >= from));
      }

      const toneOf = v => (v > 0 ? 'up' : v < 0 ? 'down' : '');
      const formatPrice = (v, digits) => v.toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits });
      const formatDelta = (v, unit) => `${v > 0 ? '+' : ''}${v.toFixed(unit === 'bp' ? 0 : 2)}${unit}`;
      const moved = (from, to, unit) => (unit === 'bp' ? (to - from) * 100 : (to / from - 1) * 100);

      function average(values, size) {
        let sum = 0;
        return values.map((v, i) => {
          sum += v - (i >= size ? values[i - size] : 0);
          return i >= size - 1 ? sum / size : null;
        });
      }

      function niceTicks(low, high, count) {
        const raw = (high - low) / count;
        const power = 10 ** Math.floor(Math.log10(raw));
        const step = [1, 2, 2.5, 5, 10].map(m => m * power).find(v => v >= raw);
        const ticks = [];
        for (let v = Math.ceil(low / step) * step; v <= high; v += step) ticks.push(v);
        return ticks;
      }

      function clockOf(t) {
        const d = new Date(t * 1000);
        return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      }

      function dateTicks(days, count, isDay) {
        if (isDay && days.length < count) return days.map((text, i) => ({ i, text }));
        const ticks = [];
        for (let n = 0; n < count; n++) {
          const i = Math.round((n + 0.5) / count * (days.length - 1));
          ticks.push({ i, text: isDay ? days[i] : days.length > 380 ? `20${days[i].slice(0, 5)}` : days[i].slice(3) });
        }
        return ticks;
      }

      const BIG_W = 1000;
      const BIG_H = 490;
      const LINES = [['50', 50], ['200', 200]];

      function withHistory(quote, histories) {
        const past = histories?.[quote.key];
        if (!past) return null;
        const fresh = past.days.at(-1) !== quote.date;
        return {
          ...quote,
          hist: fresh ? [...past.hist, quote.price] : past.hist,
          days: fresh ? [...past.days, quote.date] : past.days,
        };
      }

      function BigChart({ quote }) {
        const [range, setRange] = useStored('big-range', keysOf(QUOTE_RANGES), '1y');
        const size = sizeOf(QUOTE_RANGES, range);
        const { unit, digits } = quote;
        const hasDay = quote.day?.length > 1;
        const ranges = hasDay ? QUOTE_RANGES : QUOTE_RANGES.slice(1);
        const isDay = hasDay && range === '1d';
        const from = isDay ? 0 : startIndex(quote.days, size || 365);
        const hist = isDay ? quote.day : quote.hist.slice(from);
        const days = isDay ? quote.dayT.map(clockOf) : quote.days.slice(from);
        const base = isDay ? quote.prev : hist[0];
        const slots = isDay && quote.full ? Math.max(quote.full, hist.length) : hist.length;
        const [at, scrub] = useScrub(hist.length);
        const shown = Math.min(at ?? hist.length - 1, hist.length - 1);
        const averages = isDay ? [] : LINES
          .map(([key, n]) => [key, average(quote.hist, n).slice(from)])
          .filter(([, values]) => size > 31 && values.some(v => v != null));
        const all = [...hist, base, ...averages.flatMap(([, values]) => values.filter(v => v != null))];
        const pad = (Math.max(...all) - Math.min(...all)) * 0.04 || 1;
        const low = Math.min(...all) - pad;
        const high = Math.max(...all) + pad;
        const x = i => i / (slots - 1) * BIG_W;
        const y = v => (high - v) / (high - low) * BIG_H;
        const trace = values => {
          let pen = false;
          return values.map((v, i) => {
            if (v == null) { pen = false; return ''; }
            const cmd = pen ? 'L' : 'M';
            pen = true;
            return `${cmd}${x(i).toFixed(1)},${y(v).toFixed(1)}`;
          }).join(' ');
        };
        const line = trace(hist);
        const total = moved(base, hist[shown], unit);
        const year = quote.hist.slice(startIndex(quote.days, 365));
        const top = Math.max(...year);
        const bottom = Math.min(...year);
        const last = quote.hist.at(-1);
        const ma200 = average(quote.hist, 200).at(-1);
        const ago = span => formatDelta(moved(quote.hist[startIndex(quote.days, span)], last, unit), unit);
        const stats = [
          ['1개월', ago(31)], ['3개월', ago(92)], ['1년', ago(365)],
          ['52주 최고', formatPrice(top, digits)], ['최고 대비', formatDelta(moved(top, last, unit), unit)],
          ['52주 최저', formatPrice(bottom, digits)],
          ['200일선 대비', ma200 == null ? '–' : formatDelta(moved(ma200, last, unit), unit)],
        ];
        return (
          <div className={`mk-big mk-chart ${toneOf(moved(base, hist.at(-1), unit))}`}>
            <div className="mk-big-head">
              <span className="mk-big-name">{quote.name}{QUOTE_HELP[quote.key] && <Help id={`quote:${quote.key}`} />}</span>
              <b>{formatPrice(quote.price, digits)}</b>
              <small className={toneOf(quote.chg)}>{formatDelta(quote.chg, unit)}</small>
              <Choice kind="range" label="큰 차트 기간" options={ranges} value={isDay || range !== '1d' ? range : '1y'} onChange={setRange} />
            </div>
            <div className="mk-read">
              <span>
                {isDay ? days[shown] : `20${days[shown]}`}<b>{formatPrice(hist[shown], digits)}</b>
                {averages.map(([key, values]) => values[shown] != null && (
                  <span key={key} className="mk-ma"><i className={`key ma${key}`}></i>{key}일선 {formatPrice(values[shown], digits)}</span>
                ))}
              </span>
              <span>{isDay ? '전일 종가 대비' : '기간 시작 대비'} <small className={toneOf(total)}>{formatDelta(total, unit)}</small></span>
            </div>
            <div className="mk-plot wide">
              <svg viewBox={`0 0 ${BIG_W} ${BIG_H}`} height={BIG_H} preserveAspectRatio="none" aria-hidden="true" {...scrub}>
                {niceTicks(low, high, 6).map(v => <line key={v} x1="0" x2={BIG_W} y1={y(v)} y2={y(v)} />)}
                <line className="zero" x1="0" x2={BIG_W} y1={y(base)} y2={y(base)} />
                <path className="fill" d={`${line} L${x(hist.length - 1)},${BIG_H} L0,${BIG_H} Z`} />
                {averages.map(([key, values]) => <path key={key} className={`ma${key}`} d={trace(values)} />)}
                <path className="line" d={line} />
                {at != null && <line className="cross" x1={x(shown)} x2={x(shown)} y1="0" y2={BIG_H} />}
                {at != null && <line className="cross" x1="0" x2={BIG_W} y1={y(hist[shown])} y2={y(hist[shown])} />}
              </svg>
              <div className="mk-guides" aria-hidden="true">
                {niceTicks(low, high, 6).map(v => <span key={v} style={{ top: y(v) }}>{formatPrice(v, Math.min(digits, 2))}</span>)}
              </div>
            </div>
            <div className="mk-big-dates" aria-hidden="true">
              {dateTicks(days, 6, isDay).map(t => <span key={t.i} style={{ left: `${t.i / (slots - 1) * 100}%` }}>{t.text}</span>)}
            </div>
            <dl className="mk-big-stats">
              {stats.map(([k, v]) => <div key={k}><dt>{k}</dt><dd>{v}</dd></div>)}
            </dl>
          </div>
        );
      }

      function QuoteRow({ quote, view, open, onToggle }) {
        const { price, chg, unit, digits, m3 } = quote;
        const { line } = scaled(m3, QUOTE_W, QUOTE_H);
        const late = Date.now() / 1000 - quote.time > DAY_S;
        const day = new Date(quote.time * 1000);
        return (
          <li className={quote.stale ? 'stale' : ''}>
            <button className="mk-q-row" aria-expanded={open} onClick={onToggle}>
              <span className="mk-q-name">{quote.name}{late && <small>{day.getUTCMonth() + 1}.{day.getUTCDate()}</small>}</span>
              {view === 'day' && quote.day?.length > 1 ? <DayLine quote={quote} width={QUOTE_W} height={QUOTE_H} /> : (
                <svg className={toneOf(moved(m3[0], m3.at(-1), unit))} width={QUOTE_W} height={QUOTE_H} aria-hidden="true">
                  <path className="fill" d={`${line} L${QUOTE_W},${QUOTE_H} L0,${QUOTE_H} Z`} />
                  <path className="line" d={line} />
                </svg>
              )}
              <span className="mk-q-px">{formatPrice(price, digits)}<small className={toneOf(chg)}>{formatDelta(chg, unit)}</small></span>
            </button>
          </li>
        );
      }

      function QuoteSide({ quotes, flip, detail, onDetail }) {
        const [open, setOpen] = useStored('quotes', ['open', 'closed'], 'closed');
        const [view, setView] = useStored('row-view', keysOf(ROW_VIEWS), 'day');
        if (!quotes) return null;
        const at = new Date(quotes.generated * 1000);
        const clock = `${String(at.getHours()).padStart(2, '0')}:${String(at.getMinutes()).padStart(2, '0')}`;
        if (open === 'closed') {
          return (
            <button className={`mk-handle ${flip ? 'flip' : ''}`} aria-expanded="false" onClick={() => setOpen('open')}>시세</button>
          );
        }
        return (
          <aside className={`mk-side ${flip ? 'flip' : ''}`} aria-label="시세">
            <header className="mk-head">
              <span>시세</span>
              <span className="mk-date">{clock} 갱신 · 매분<button className="mk-close" aria-label="시세 접기" onClick={() => setOpen('closed')}>✕</button></span>
            </header>
            <Choice kind="range" label="시세 그래프" options={ROW_VIEWS} value={view} onChange={setView} />
            <MarketBoundary key={quotes.generated}>
              {quotes.groups.map(g => (
                <React.Fragment key={g.group}>
                  <h2>{g.group}</h2>
                  <ul className="mk-quotes">{g.items.map(q => <QuoteRow key={q.key} quote={q} view={view} open={detail === q.key} onToggle={() => onDetail(detail === q.key ? null : q.key)} />)}</ul>
                </React.Fragment>
              ))}
            </MarketBoundary>
            <footer>누르면 큰 차트 · 점선은 전일 종가 · 일부 10~15분 지연</footer>
          </aside>
        );
      }

      const fearText = v => (
        v >= 80 ? '겁에 질려 앞다퉈 파는 분위기입니다' : v >= 60 ? '많이 겁먹은 분위기입니다'
          : v >= 40 ? '평소 수준의 긴장감입니다' : v >= 20 ? '편안한 분위기입니다' : '걱정이 거의 없는 분위기입니다'
      );
      const crowdText = v => (
        v >= 80 ? '너도나도 몰려든 분위기입니다' : v >= 60 ? '제법 몰려 있습니다'
          : v >= 40 ? '몰리지도 떠나지도 않은 상태입니다' : v >= 20 ? '관심이 식은 편입니다' : '많이들 떠난 분위기입니다'
      );
      const gapText = dev => (dev > 0 ? `${dev}% 위` : dev < 0 ? `${-dev}% 아래` : '같은 높이');
      const stepText = (from, to) => (to > from ? `${to - from} 올라 ${to}` : to < from ? `${from - to} 내려 ${to}` : `그대로 ${to}`);

      function summaryText({ index }) {
        const risk = index.signals.find(x => x.verified);
        const price = `추세선보다 ${gapText(index.trend.dev)}로 ‘${orbitZone(index.trend.dev)}’ 구간`;
        return `미국 시장: ${fearText(index.fear)}. ${crowdText(index.crowd)}. ${index.name} 가격은 ${price}입니다. ${risk?.pending ? `이번 달 10개월선 ${risk.on ? '아래로 내려왔습니다' : '위로 올라왔습니다'}(월말 확정 전).` : risk?.on ? '10개월선 아래라 평소보다 크게 출렁일 수 있습니다.' : '10개월선 위라 크게 빠질 위험은 평소 수준입니다.'}`;
      }

      const partOf = (index, label) => index.parts.find(x => x.label === label);
      const feelOf = (entry, pct) => entry.feel[pct >= 90 ? 0 : pct >= 70 ? 1 : pct > 30 ? 2 : pct > 10 ? 3 : 4];
      const partNow = label => ({ index }) => {
        const part = partOf(index, label);
        return part ? `${part.value} · ${feelOf(HELP[label], part.pct)}. 최근 10년 중 순위는 ${part.pct}입니다(100이 최고).` : null;
      };
      const signalOf = (index, label) => index.signals.find(x => x.label === label);
      const signalNow = label => ({ index }) => {
        const sig = signalOf(index, label);
        if (!sig) return null;
        return `${sig.on ? '켜짐' : '꺼짐'}${sig.value ? ` (${sig.value})` : ''}${sig.pending ? ', 월말 확정 전' : ''}. 과거에 켜진 달 100번 중 ${sig.hit}번은 그 뒤 1년 안에 20% 이상 빠졌습니다. 꺼진 달은 100번 중 ${sig.base}번이었습니다.`;
      };
      const UNPROVEN = '우연히 나올 수 있는 정도의 차이라 참고로만 봅니다.';

      const HELP = {
        guide: {
          title: '시장 온도계 읽는 법',
          what: '언제 사고팔지 알려주지 않습니다. 지금 분위기와 내 마음을 점검하는 화면입니다.',
          now: summaryText,
          read: [
            ['공포·쏠림', '사람들이 겁먹었는지, 몰려들었는지 봅니다.'],
            ['궤도', '지수가 오랜 평균 속도보다 앞서 있는지 봅니다. 추세선을 어느 해부터 긋느냐에 따라 답이 달라지므로 범위를 함께 봅니다.'],
            ['위험 점검', '10개월선만 보세요. 효과가 확인된 것은 이것뿐입니다.'],
          ],
          tip: [
            '점수가 20~80 사이면 대부분 신경 쓰지 않아도 됩니다. 그 밖이면 움직이기 전에 하루만 멈춰 보세요.',
            '?나 항목 이름에 마우스를 올리면 설명이 나옵니다.',
          ],
        },
        badge: {
          title: 'LIVE와 CLOSE',
          what: '지금 보이는 점수가 장중의 값인지, 장이 끝난 뒤 확정된 값인지 알려줍니다.',
          now: ({ market }) => (isStale(market.asof)
            ? '갱신 지연. 새 값을 받지 못해 예전 값을 보여주고 있습니다.'
            : market.live
              ? `LIVE. ${market.generated.slice(11, 16)}에 계산했고, 장이 끝날 때까지 바뀝니다.`
              : 'CLOSE. 장이 끝난 뒤 확정한 값입니다.'),
          read: [
            ['LIVE', '장이 열려 있어 지금 시세로 계산한 값입니다. 10분마다 다시 계산하므로 장이 끝날 때까지 바뀝니다.'],
            ['CLOSE', '장이 끝난 뒤 종가(그날 마지막 가격)로 확정한 값입니다. 한국시간 06:40에 나옵니다.'],
          ],
          note: 'LIVE일 때도 신용융자, 회사채 금리차, 3배 ETF 비중은 지금 값이 없어 가장 최근에 나온 값을 씁니다.',
        },
        fear: {
          axis: 'fear', title: '공포',
          what: '사람들이 얼마나 겁먹었는지를 0~100으로 나타냅니다. 구성 목록의 빨간 항목 5개 순위를 평균한 값입니다.',
          now: ({ index }) => `${index.fear}. ${fearText(index.fear)}.`,
          read: [
            ['80↑', '겁에 질려 앞다퉈 파는 때. 크게 튀어 오른 적도, 더 크게 빠진 적도 많았습니다.'],

      const HELP_ICON_MS = 150;
      const HELP_NAME_MS = 200;
      const HelpContext = React.createContext(null);

      function useHelp() {
        const [help, setHelp] = useState(null);
        const timer = useRef(null);
        const api = useMemo(() => {
          const show = next => { clearTimeout(timer.current); setHelp(next); };
          return {
            open: (id, el) => show({ id, el }),
            close: () => show(null),
            rest: (id, el, ms) => {
              clearTimeout(timer.current);
              timer.current = setTimeout(() => { if (el.isConnected) show({ id, el }); }, ms);
            },
          };
        }, []);
        useEffect(() => api.close, [api]);
        return [help, api];
      }

      function Help({ id, children }) {
        const [help, api] = React.useContext(HelpContext);
        const open = help?.id === id;
        const enter = e => api.rest(id, e.currentTarget, children ? HELP_NAME_MS : HELP_ICON_MS);
        return (
          <button
            className={children ? 'mk-help-name' : 'mk-help-icon'}
            aria-label={children ? undefined : '설명'}
            aria-haspopup="dialog"
            aria-expanded={open}
            onPointerEnter={enter}
            onPointerLeave={api.close}
            onFocus={e => { if (e.currentTarget.matches(':focus-visible')) enter(e); }}
            onBlur={api.close}
            onClick={e => api.open(id, e.currentTarget)}
          >
            {children ?? '?'}
          </button>
        );
      }
