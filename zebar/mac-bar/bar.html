                  {index.parts.map(part => (
                    <li key={part.label} className={part.axis}>
                      <span className="mk-part-name"><Help id={part.label}>{part.label}</Help></span>
                      <span className="mk-part-val">{part.value}</span>
                      <span className="mk-track"><span className="mk-fill" style={{ width: `${part.pct}%` }}></span></span>
                      <span className="mk-part-pct">{part.pct}</span>
                    </li>
                  ))}
                </ul>

                <h2><span className="mk-title">과거 비슷한 날<Help id="zones" /></span> <span>1년 뒤</span></h2>
                <ZoneTable indices={market.indices} />
              </div>

              <div>
                <h3 className="mk-scope">지수별</h3>
                <div className="mk-tabs first" role="group" aria-label="지수">
                  {market.indices.map(i => (
                    <button key={i.key} aria-pressed={i.key === index.key} className="mk-tab" onClick={() => setSelected(i.key)}>
                      <span className="mk-tab-name">{i.name}</span>
                      <span className="mk-tab-px">
                        {(liveOf(i)?.price ?? i.close).toLocaleString('en-US', { maximumFractionDigits: 0 })}
                        <small className={`mk-chg ${toneOf(liveOf(i)?.chg ?? i.chg)}`}>{formatDelta(liveOf(i)?.chg ?? i.chg, '%')}</small>
                      </span>
                    </button>
                  ))}
                </div>
                <PeakLine peak={index.peak} />
                <OrbitDial trend={index.trend} />
                <OrbitChart index={index} other={market.indices.find(i => i !== index) ?? index} />

                <h2><span className="mk-title">위험 점검<Help id="signals" /></span> <span>1년 내 20% 하락 빈도</span></h2>
                <SignalTable signals={index.signals} />
              </div>
            </div>
            <footer>분위기 참고용이며 예측이 아닙니다 · 점수는 장중 10분마다 바뀌고 06:40에 확정</footer>
            </div>
            </div>
            {help && (
              <MarketBoundary key={help.id}>
                <HelpCard help={help} context={{ index, market }} panel={box} />
              </MarketBoundary>
            )}
            <MarketBoundary><QuoteSide quotes={quotes} flip={!pinned && left < SIDE_ROOM} detail={detail} onDetail={setDetail} /></MarketBoundary>
          </section>
          </HelpContext.Provider>
        );
      });

      function PinnedMarket() {
        const [hidden, setHidden] = useState(false);
        const quotes = useJson(hidden ? null : './quotes.json', QUOTES_POLL_MS);
        const market = useJson(hidden ? null : './market.json', MARKET_POLL_MS, quotes?.market);
        const [items, toggleItem] = useBarItems();
        const [shown, setShown] = useState(false);
        const [settled, setSettled] = useState(false);
        const root = useRef(null);
        const spot = useRef(readSpot());

        useEffect(() => {
          navigator.locks.request(PIN_WARM, () => new Promise(() => {})).catch(() => {});
        }, []);
        useEffect(() => {
          if (hidden) return;
          let release;
          navigator.locks.request(PIN_LOCK, () => new Promise(resolve => { release = resolve; })).catch(() => {});
          return () => release?.();
        }, [hidden]);

        const place = useCallback(async () => {
          const win = zebar.currentWidget().window.tauri;
          const scale = window.devicePixelRatio;
          const width = Math.ceil(root.current.offsetWidth * scale);
          const height = Math.ceil(root.current.offsetHeight * scale);
          if (!width || !height) return;
          if (!spot.current) {
            const [at, size] = [await win.outerPosition(), await win.innerSize()];
            spot.current = { right: at.x + size.width, y: at.y };
          }
          await win.setSize({ type: 'Physical', width, height });
          await win.setPosition({ type: 'Physical', x: spot.current.right - width, y: spot.current.y });
        }, []);

        useEffect(() => {
          if (!market || !settled) return;
          let alive = true;
          (async () => {
            await place().catch(() => {});
            if (!alive) return;
            setShown(true);
            setTimeout(() => post(PIN_LOCK, 'ready'), 80);
          })();
          return () => { alive = false; };
        }, [!!market, settled, place]);

        useEffect(() => {
          const observer = new ResizeObserver(() => { place().catch(() => {}); });
          observer.observe(root.current, { box: 'border-box' });
          return () => observer.disconnect();
        }, [place]);

        const drag = useCallback(e => {
          if (e.button !== 0 || e.target.closest('button') || !spot.current) return;
          const start = { screenX: e.screenX, screenY: e.screenY, ...spot.current };
          const target = e.currentTarget;
          target.setPointerCapture(e.pointerId);
          const win = zebar.currentWidget().window.tauri;
          let busy = false;
          const move = ev => {
            const scale = window.devicePixelRatio;
            spot.current = {
              right: Math.round(start.right + (ev.screenX - start.screenX) * scale),
              y: Math.round(start.y + (ev.screenY - start.screenY) * scale),
            };
            if (busy) return;
            busy = true;
            const width = Math.ceil(root.current.offsetWidth * scale);
            win.setPosition({ type: 'Physical', x: spot.current.right - width, y: spot.current.y })
              .catch(() => {}).finally(() => { busy = false; });
          };
          const end = () => {
            target.removeEventListener('pointermove', move);
            target.removeEventListener('pointerup', end);
            target.removeEventListener('pointercancel', end);
            saveSpot(spot.current);
            place().catch(() => {});
          };
          target.addEventListener('pointermove', move);
          target.addEventListener('pointerup', end);
          target.addEventListener('pointercancel', end);
        }, [place]);

        useEffect(() => {
          const channel = new BroadcastChannel(PIN_SHOW);
          channel.onmessage = async () => {
            spot.current = readSpot();
            setHidden(false);
            await place().catch(() => {});
            await zebar.currentWidget().window.tauri.show().catch(() => {});
            setTimeout(() => post(PIN_LOCK, 'ready'), 80);
          };
          return () => channel.close();
        }, [place]);

        const unpin = useCallback(() => {
          const win = zebar.currentWidget().window.tauri;
          win.hide().then(() => setHidden(true), () => win.close());
        }, []);
        return (
          <div ref={root} className={`mk-pin ${shown ? 'shown' : ''}`}>
            {market && (
              <MarketBoundary key={market.generated}>
                <MarketPanel market={market} quotes={quotes} items={items} onToggleItem={toggleItem} visible left={0} pinned onPin={unpin} onDrag={drag} onSettled={setSettled} />
              </MarketBoundary>
            )}
          </div>
        );
      }

      const BAR_LEVELS = [0.4, 0.8, 0.55, 1];

      function PlaybackBars() {
        const [phase, setPhase] = useState(0);
        useEffect(() => {
          if (SOFT_RENDER) return;
          const id = setInterval(() => setPhase(p => (p + 1) % BAR_LEVELS.length), 250);
          return () => clearInterval(id);
        }, []);
        return (
          <span className="viz" aria-hidden="true">
            {[0, 1, 2].map(i => (
              <span key={i} style={{ transform: `scaleY(${BAR_LEVELS[(phase + i) % BAR_LEVELS.length]})` }} />
            ))}
          </span>
        );
      }

      function App() {
        const [out, setOut] = useState(providers.outputMap);
        useEffect(() => {
          if (!SOFT_RENDER) return providers.onOutput(() => setOut(providers.outputMap));
          // glazewm emits an event per window-title change — a busy terminal
          // fires several per second, and every repaint is a CPU rasterize on
          // WARP. Trailing 250ms debounce caps renders at 4/s worst-case.
          let id = null;
          const unsub = providers.onOutput(() => {
            if (id) return;
            id = setTimeout(() => { id = null; setOut(providers.outputMap); }, 250);
          });
          return () => { clearTimeout(id); if (typeof unsub === 'function') unsub(); };
        }, []);
        const gpu = useGpu();
        const quotes = useJson('./quotes.json', QUOTES_POLL_MS);
        const market = useJson('./market.json', MARKET_POLL_MS, quotes?.market);
        const hover = useHoverPanel();
        const held = useRef(null);
        if (hover.visible || !held.current) held.current = quotes;
        const [items, toggleItem] = useBarItems();
        useEffect(() => writeJumpMap(out.glazewm), [out.glazewm]);
        const deadTray = useDeadTrayIcons((out.systray?.icons || []).map(i => i.id).join(','));

        return (
          <>
          <div className="app">
            <div className="left">
              <i className="logo nf nf-fa-windows"></i>
              {out.glazewm && (
                <div className="workspaces">
                  {out.glazewm.currentWorkspaces.map(ws => (
                    <button
                      key={ws.name}
                      className={`ws ${ws.hasFocus ? 'focused' : ''} ${ws.isDisplayed ? 'displayed' : ''}`}
                      onClick={() => out.glazewm.runCommand(`focus --workspace ${ws.name}`)}
                    >
                      {ws.displayName ?? ws.name}
                    </button>
                  ))}
                </div>
              )}
              {out.glazewm?.isPaused && (
                <button className="pill paused" onClick={() => out.glazewm.runCommand('wm-toggle-pause')}>
                  PAUSED
                </button>
              )}
              {out.glazewm?.bindingModes.map(m => (
                <button
                  key={m.name}
                  className="pill mode"
                  onClick={() => out.glazewm.runCommand(`wm-disable-binding-mode --name ${m.name}`)}
                >
                  {m.displayName ?? m.name}
                </button>
              ))}
              {out.glazewm?.displayedWorkspace && workspaceWindows(out.glazewm.displayedWorkspace).length > 0 && (
                <div className="windows">
                  {workspaceWindows(out.glazewm.displayedWorkspace).map((win, i) => (
                    <button
                      key={win.id}
                      className={`win ${win.hasFocus ? 'focused' : ''} ${win.state?.type === 'minimized' ? 'minimized' : ''}`}
                      title={win.title || win.processName}
                      onClick={async () => {
                        if (win.state?.type === 'minimized')
                          await out.glazewm.runCommand('toggle-minimized', win.id);
                        out.glazewm.runCommand(`focus --container-id ${win.id}`);
                      }}
                    >
                      {out.glazewm.displayedWorkspace.hasFocus && i < JUMP_HINTS.length && (
                        <span className="hint">{JUMP_HINTS[i]}</span>
                      )}
                      {win.processName.replace(/\.exe$/i, '')}
                    </button>
                  ))}
                </div>
              )}
            </div>

            <div className="right">
              {out.media?.currentSession?.title && (
                <button
                  className={`stat media ${out.media.currentSession.isPlaying ? 'playing' : 'paused'}`}
                  onClick={() => out.media.togglePlayPause()}
                  title={`${out.media.currentSession.title}${out.media.currentSession.artist ? ' — ' + out.media.currentSession.artist : ''}`}
                >
                  {out.media.currentSession.isPlaying ? (
                    <PlaybackBars />
                  ) : (
                    <i className="nf nf-md-pause"></i>
                  )}
                  <span className="media-title">{out.media.currentSession.title}</span>
                </button>
              )}
              {out.cpu && <RunCat cpuUsage={out.cpu.usage} />}
              {market && <MarketBoundary key={market.generated}><MarketStat market={market} quotes={quotes} items={items} triggerRef={hover.trigger} open={hover.visible} onEnter={hover.enter} onLeave={hover.leave} onClick={hover.show} /></MarketBoundary>}
              <ImeBadge />
              <UsageStat name="CPU" reading={out.cpu}>
                <i className="nf nf-oct-cpu"></i>
              </UsageStat>
              <UsageStat name="Memory" reading={out.memory}>
                <i className="nf nf-fae-chip"></i>
              </UsageStat>
              <UsageStat name="GPU" reading={gpu}>
                <svg width="17" height="13" viewBox="0 0 24 18" fill="currentColor" aria-hidden="true">
                  <path d="M1 1h3v2h17a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H4v2H2V3H1Z
                           M12 8.5a3.5 3.5 0 1 0-7 0 3.5 3.5 0 0 0 7 0
                           M21 8.5a3.5 3.5 0 1 0-7 0 3.5 3.5 0 0 0 7 0" fillRule="evenodd" />
                  <path id="gpu-fan" d="M8.5 8.5Q6 8 7 6q2-1 1.5 2.5Q10 6.5 11 8.5q0 2-2.5 0Q9.5 11 7.5 11q-1.5-1 1-2.5Z" />
                  <use href="#gpu-fan" x="9" />
                  <path d="M6 15h3v2H6zm4 0h7v2h-7z" />
                </svg>
              </UsageStat>
              {out.network && (
                <span className="stat network">
                  <i className={networkIcon(out.network)}></i>
                  {out.network.traffic && (
                    <span className="traffic">
                      <span className="traffic-row up">
                        <span className="traffic-label">U</span>{formatRate(out.network.traffic.transmitted)}
                      </span>
                      <span className="traffic-row down">
                        <span className="traffic-label">D</span>{formatRate(out.network.traffic.received)}
                      </span>
                    </span>
                  )}
                </span>
              )}
              {out.audio?.defaultPlaybackDevice && (
                <span className={`stat compact audio divider-left ${out.audio.defaultPlaybackDevice.isMuted ? 'muted' : ''}`}>
                  <i className={volumeIcon(out.audio.defaultPlaybackDevice)}></i>
                  <span className="metric">{Math.round(out.audio.defaultPlaybackDevice.volume)}%</span>
                </span>
              )}
              {out.battery && (
                <span className={`stat compact battery ${out.battery.isCharging ? 'charging' : ''}`}>
                  <BatteryIcon percent={out.battery.chargePercent} charging={out.battery.isCharging} />
                  <span className="metric">{Math.round(out.battery.chargePercent)}%</span>
                </span>
              )}
              {(() => {
                const visibleIcons = (out.systray?.icons || []).filter(
                  i => !isBlockedTrayIcon(i.tooltip) && !deadTray.has(i.id),
                );
                if (!visibleIcons.length) return null;
                return (
                  <span className="systray">
                    {visibleIcons.map(icon => (
                      <button
                        key={icon.id}
                        className="tray-icon"
                        title={icon.tooltip}
                        onClick={() => { lastTrayClick = Date.now(); out.systray.onLeftClick(icon.id); }}
                        onContextMenu={e => {
                          e.preventDefault();
                          lastTrayClick = Date.now();
                          out.systray.onRightClick(icon.id);
                        }}
                      >
                        <img src={icon.iconUrl} alt="" />
                      </button>
                    ))}
                  </span>
                );
              })()}
              {out.date && <span className="clock">{out.date.formatted}</span>}
            </div>
          </div>
          {market && (
            <MarketBoundary key={market.generated}>
              <MarketPanel
                market={market}
                quotes={held.current}
                items={items}
                onToggleItem={toggleItem}
                visible={hover.visible}
                left={hover.left}
                panelRef={hover.panel}
                onEnter={hover.enter}
                onLeave={hover.leave}
                onPin={hover.pin}
              />
            </MarketBoundary>
          )}
          </>
        );
      }
    </script>
  </body>
</html>
